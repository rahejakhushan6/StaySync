# ========================================================
# StaySync Backend Configuration
# ========================================================

spring.application.name=staysync-backend
server.port=8080

# Active Profile & Database Settings
# Default: H2 in-memory DB for immediate startup without requiring external MySQL setup
spring.datasource.url=jdbc:h2:mem:staysyncdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Production Profile Configuration (Uncomment when running with local MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/staysync_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=rootpassword
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
staysync.jwt.secret=9a7c8b2e4f6d1a3c5e7b9d0f2a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2b4d6f8a0c
staysync.jwt.expiration-ms=86400000

# Groq AI Service Configuration
groq.api.key=${GROQ_API_KEY:gsk_demo_dummy_key_staysync}
groq.api.model=llama-3.3-70b-versatile
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# CORS Allowed Origins
staysync.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:8000
